# Beelink override (2026-09-06): Bot browser headed under Xvfb (no HeadlessChrome UA) + noVNC so the owner
# can sign in to sites from any device. VNC is bound to the Tailscale IP only; password in .env (VNC_PASSWORD).
services:
  agent-computer:
    build:
      context: .
      dockerfile: agent-computer/Dockerfile.beelink
    environment:
      COMPUTER_HEADED: "on"
      DISPLAY: ":99"
      VNC_PASSWORD: ${VNC_PASSWORD}
    init: true
    command: ["sh", "src/start-headed.sh"]
    ports:
      - "100.122.56.122:6080:6080"
    shm_size: "1g"
